id: "rehder2005_shj"
title: "Rehder & Hoffman (2005): trial-level replication of Types I, II, IV, and VI of Shepard, Hovland, & Jenkins (1961), with eye-tracking"
citation: "Rehder, B., & Hoffman, A. B. (2005). Eyetracking and selective attention in category learning. Cognitive Psychology, 51(1), 1-41. https://doi.org/10.1016/j.cogpsych.2004.11.001"
license: "Redistributed via ajwills72/sixproblems (github.com/ajwills72/sixproblems), which states no explicit license; data were requested from and provided by Rehder to Andy Wills, who verified mean blocks-to-criterion by problem type matched the source paper. Several columns (logstim, logcat, L_aoi, respCB) were reverse-engineered by Schlegelmilch, as the original experiment source code was unavailable -- see the note in man/rehder05tld.Rd of the upstream package for details. Contact the sixproblems maintainer and/or Rehder before further redistribution."
domain: categorization
task_type: category-learning
columns:
  - name: s
    type: integer
    description: Unique subject ID (72 participants; only problem Types I, II, IV, and VI were tested -- III and V are not in this dataset)
  - name: type
    type: integer
    description: Shepard, Hovland, & Jenkins (1961) problem type (1, 2, 4, or 6 in this experiment)
  - name: dimorder
    type: integer
    description: "Counterbalancing of physical to abstract stimulus dimensions (1-3). Note: reverse engineering indicated incomplete counterbalancing for Type I (the relevant dimension is the same for dimorder 1 and 3)."
  - name: respCB
    type: double
    description: Response counterbalance condition, i.e. the mapping of the resp_key DV to logcat (reverse-engineered; see license note)
  - name: block
    type: integer
    description: Training block number (up to 28; 8 trials per block)
  - name: trial
    type: integer
    description: Trial number within block (1-8)
  - name: trialid
    type: character
    description: Three-digit code for the physical stimulus presented that trial
  - name: logstim
    type: character
    description: As trialid, but for the logical stimulus (invariant over dimorder; reverse-engineered, see license note)
  - name: logcat
    type: double
    description: Logical category membership (0/1) of the presented stimulus, invariant across counterbalance conditions (reverse-engineered, see license note)
  - name: correct
    type: integer
    description: 1 if the response was correct, 0 if not
  - name: DV
    type: character
    description: "Which dependent variable this row's `value` reports: resp_key (0/1 response key), resp_rt (response time, ms), eye_obs (number of eye-track fixations), eye_rt (total eye-track dwell time, ms), or eye_pri (eye-track relative-priority measure; see source paper). The table is in long format: one row per (trial, DV[, aoi, period]) combination rather than one row per trial."
  - name: aoi
    type: integer
    description: For eye-track DVs, the area of interest (1-3, corresponding to the screen locations of the three stimulus dimensions) this value refers to; NA for non-eye-track DVs
  - name: L_aoi
    type: double
    description: As aoi, but invariant over dimorder (reverse-engineered, see license note)
  - name: period
    type: character
    description: For eye-track DVs, whether the observation period was before or after the participant's response
  - name: value
    type: double
    description: The value of the dependent variable named in the DV column for this row
